services:
  # 1. FastAPI Backend
  - type: web
    name: candidate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  # 2. Streamlit Frontend
  - type: web
    name: candidate-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_BASE
        value: http://candidate-backend:10000
      - key: PYTHON_VERSION
        value: 3.10.0
