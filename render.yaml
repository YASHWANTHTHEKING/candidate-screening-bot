services:
  # 1. Managed PostgreSQL Database
  - type: database
    name: candidate-db
    databaseName: candidate_screening
    user: admin
    plan: free

  # 2. FastAPI Backend
  - type: web
    name: candidate-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: candidate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0

  # 3. Streamlit Frontend
  - type: web
    name: candidate-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_BASE
        value: http://candidate-backend:10000
      - key: PYTHON_VERSION
        value: 3.10.0
